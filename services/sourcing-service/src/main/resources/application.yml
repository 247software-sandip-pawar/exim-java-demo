spring:
  application:
    name: sourcing-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-of-at-least-32-bytes-please}
  clients:
    identity:
      base-url: ${IDENTITY_BASE_URL:http://localhost:8081}
    catalog:
      base-url: ${CATALOG_BASE_URL:http://localhost:8083}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8084
