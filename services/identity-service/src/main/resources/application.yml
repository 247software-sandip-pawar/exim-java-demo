spring:
  application:
    name: identity-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
  # Datasource + Flyway are configured in code (IdentityDataSourceConfig); disable the
  # single-datasource auto-configuration so it does not fight the in-code wiring.
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

app:
  jwt:
    # MUST match every other service's secret so they can validate the same tokens.
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-of-at-least-32-bytes-please}
    access-token-expiration-ms: 900000   # 15 minutes
  security:
    public-paths: /api/v1/auth/**

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8081
