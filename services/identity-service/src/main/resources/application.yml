spring:
  application:
    name: identity-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # MongoDB connection. In Spring Boot 4 the connection lives under spring.mongodb.*
  # (spring.data.mongodb.* only holds Spring-Data settings like auto-index-creation).
  # MONGODB_URI is the cluster connection string (e.g. an Atlas mongodb+srv URI) shared by
  # every service; each service writes to its OWN database (`database` below).
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/?directConnection=true}
    database: ${IDENTITY_DB_NAME:exim_identity}
    representation:
      uuid: standard   # entities use UUID ids; without this the driver refuses to encode them
  data:
    mongodb:
      auto-index-creation: true

app:
  jwt:
    # MUST match every other service's secret so they can validate the same tokens.
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-of-at-least-32-bytes-please}
    access-token-expiration-ms: 900000   # 15 minutes
  security:
    public-paths: /api/v1/auth/**
  # Seeds a PLATFORM_ADMIN on startup if one with this email doesn't exist (idempotent).
  # Override the password in any real environment via PLATFORM_ADMIN_PASSWORD.
  platform-admin:
    enabled: ${PLATFORM_ADMIN_ENABLED:true}
    email: ${PLATFORM_ADMIN_EMAIL:admin@hirkaniexim.com}
    password: ${PLATFORM_ADMIN_PASSWORD:Admin@12345}
    name: ${PLATFORM_ADMIN_NAME:Platform Admin}
  # Shared secret for the out-of-band POST /api/v1/auth/bootstrap-admin endpoint. Blank disables it.
  admin-bootstrap:
    secret: ${ADMIN_BOOTSTRAP_SECRET:bootstrap-me-change-in-prod}

# Atlas M0 (free tier) forbids the command Spring's Mongo health check runs against the
# 'local' db, so disable it; the app's own database access is unaffected.
management:
  health:
    mongodb:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8081
