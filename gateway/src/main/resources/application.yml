spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Verification owns the /companies/{id}/verifications sub-path. It MUST come before the
            # identity route below (first match wins), otherwise /companies/** would swallow it.
            - id: verification
              uri: ${VERIFICATION_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/companies/*/verifications,/api/v1/companies/*/verifications/**,/api/v1/verifications,/api/v1/verifications/**

            # Identity: auth, users, companies, platform staff.
            - id: identity
              uri: ${IDENTITY_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/companies/**,/api/v1/staff/**

            # Catalog: products, HS codes.
            - id: catalog
              uri: ${CATALOG_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/products/**,/api/v1/hs-codes/**

            # Sourcing: RFQs and matches.
            - id: sourcing
              uri: ${SOURCING_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/rfqs/**

            # Quotation: quote submit/accept/reject/counter.
            - id: quotation
              uri: ${QUOTATION_URI:http://localhost:8085}
              predicates:
                - Path=/api/v1/quotes/**

            # Messaging: conversations and their messages.
            - id: messaging
              uri: ${MESSAGING_URI:http://localhost:8086}
              predicates:
                - Path=/api/v1/conversations/**

            # Orders: orders created from accepted quotes, and their status.
            - id: orders
              uri: ${ORDERS_URI:http://localhost:8087}
              predicates:
                - Path=/api/v1/orders/**

            # Documents: trade documents generated for an order.
            - id: documents
              uri: ${DOCUMENTS_URI:http://localhost:8088}
              predicates:
                - Path=/api/v1/documents/**

            # Logistics: shipments, tracking, and logistics partners.
            - id: logistics
              uri: ${LOGISTICS_URI:http://localhost:8089}
              predicates:
                - Path=/api/v1/shipments/**,/api/v1/logistics-partners/**

            # Payments: escrow transactions, letters of credit, payment terms.
            - id: payments
              uri: ${PAYMENTS_URI:http://localhost:8090}
              predicates:
                - Path=/api/v1/payments/**,/api/v1/letters-of-credit/**,/api/v1/payment-terms/**

            # Billing: plans, subscriptions, platform payments (the platform's revenue).
            - id: billing
              uri: ${BILLING_URI:http://localhost:8091}
              predicates:
                - Path=/api/v1/plans/**,/api/v1/subscriptions/**,/api/v1/platform-payments/**

            # Trust: ratings and disputes.
            - id: trust
              uri: ${TRUST_URI:http://localhost:8092}
              predicates:
                - Path=/api/v1/ratings/**,/api/v1/disputes/**

            # Notification: in-app notifications.
            - id: notification
              uri: ${NOTIFICATION_URI:http://localhost:8093}
              predicates:
                - Path=/api/v1/notifications/**

            # Admin: KYC approval, sanctions screening, audit log, metrics.
            - id: admin
              uri: ${ADMIN_URI:http://localhost:8094}
              predicates:
                - Path=/api/v1/admin/**

            # Activity: platform-wide user activity audit trail.
            - id: activity
              uri: ${ACTIVITY_URI:http://localhost:8095}
              predicates:
                - Path=/api/v1/activity/**

# Base URL the activity-logging filter posts each recorded request to (the activity-service direct,
# not back through the gateway). Set blank to disable activity logging.
app:
  activity:
    base-url: ${ACTIVITY_URI:http://localhost:8095}

server:
  port: 8080
