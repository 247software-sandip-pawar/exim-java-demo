# Nginx site for hirkaniexim.com — serves the React SPA and proxies /api to the gateway.
# Same-origin: the SPA calls /api/v1 (relative), so no CORS is needed.
# Install:  sudo cp deploy/nginx/hirkaniexim.com.conf /etc/nginx/sites-available/hirkaniexim.com
#           sudo ln -s /etc/nginx/sites-available/hirkaniexim.com /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (see DEPLOYMENT.md) — it rewrites this file to add the TLS lines automatically.

server {
    listen 80;
    listen [::]:80;
    server_name hirkaniexim.com www.hirkaniexim.com;

    # Static React build (output of `npm run build`).
    root /var/www/hirkaniexim/dist;
    index index.html;

    client_max_body_size 10m;

    # API → gateway (single entry point for all 15 services).
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback: client-side routes (/app, /admin, /pricing, …) must return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
