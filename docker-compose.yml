# Local development infrastructure: PostgreSQL (primary DB) + Redis (cache, used from Phase 4).
# Start with:  docker compose up -d
services:
  postgres:
    image: postgres:17
    container_name: exim-postgres
    environment:
      POSTGRES_DB: exim
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - exim-pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: exim-redis
    ports:
      - "6379:6379"

volumes:
  exim-pg-data:
