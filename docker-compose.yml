# Local development infrastructure: MongoDB + Redis (Redis used from Phase 4).
# Start with:  docker compose up -d
#
# This provisions only the backing infrastructure. Run the services themselves with
# `mvn spring-boot:run` per module (gateway :8080, identity :8081, verification :8082,
# catalog :8083, sourcing :8084), or build images per service later.
#
# NOTE: This stack is OPTIONAL — the primary target is MongoDB Atlas (cloud free tier). Set
# MONGODB_URI to your Atlas connection string and you can skip this file entirely. It exists so
# the stack can also run fully offline.
#
# MongoDB runs as a SINGLE-NODE REPLICA SET (--replSet rs0). A replica set is required for
# multi-document transactions, which the services use via @Transactional. The healthcheck below
# also performs the one-time rs.initiate() so no manual step is needed; each service connects with
# MONGODB_URI=mongodb://localhost:27017/?directConnection=true (the dev default).
services:
  mongo:
    image: mongo:7
    container_name: exim-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - exim-mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }\""]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 10

  redis:
    image: redis:7
    container_name: exim-redis
    ports:
      - "6379:6379"

volumes:
  exim-mongo-data:
