# Local development — one PostgreSQL database PER MODULE on your locally
# installed PostgreSQL (the one you manage in pgAdmin), port 5432.
#
# Before first run, create the per-module databases once:
#   db/bootstrap/create-databases.sql   (Phase 1 needs: exim_identity)
#
# Adjust the password below to match your local 'postgres' user.
spring:
  jpa:
    show-sql: true

app:
  datasource:
    # Phase 1 — identity module
    identity:
      url: jdbc:postgresql://localhost:5432/exim_identity
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver

    # As each module is built, add its own block here, e.g.:
    # catalog:
    #   url: jdbc:postgresql://localhost:5432/exim_catalog
    #   username: postgres
    #   password: postgres
    #   driver-class-name: org.postgresql.Driver
