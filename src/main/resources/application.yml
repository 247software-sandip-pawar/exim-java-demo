spring:
  application:
    name: exim-marketplace-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate        # schema is owned by Flyway, never auto-generated
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

# Application-specific settings
app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-of-at-least-32-bytes-please}
    access-token-expiration-ms: 900000   # 15 minutes

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080
