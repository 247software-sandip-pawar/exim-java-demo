spring:
  application:
    name: exim-marketplace-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
  # Datasources, JPA contexts and Flyway are configured PER MODULE in code
  # (see com.eximplatform.config.datasource.*), one PostgreSQL database per module.
  # The global Spring Boot auto-configuration for a single datasource/Flyway is
  # therefore disabled here so it does not fight the per-module wiring.
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# Application-specific settings
app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-of-at-least-32-bytes-please}
    access-token-expiration-ms: 900000   # 15 minutes

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080
