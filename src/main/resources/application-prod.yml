# Production — every value comes from environment variables.
# Each module points at its own managed PostgreSQL database.
spring:
  jpa:
    show-sql: false

app:
  datasource:
    identity:
      url: ${IDENTITY_DB_URL}
      username: ${IDENTITY_DB_USER}
      password: ${IDENTITY_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
